[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-logmel-fusion"
version = "0.1.0"
description = "Fused log-mel spectrogram frontend in Triton, measured against torchaudio and Whisper."
requires-python = ">=3.10"
dependencies = [
    "torch==2.8.0",
    "triton==3.4.0",
    "torchaudio==2.8.0",
    "openai-whisper",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
